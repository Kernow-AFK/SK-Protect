name: Player feedback
description: Tell us what works, what is confusing, or how a workflow could improve.
title: "Feedback: "
labels: [feedback]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Installation, Privacy controls, Uninterrupted browsing, Multi-instance installer, Preferred Mods, Accessibility, Documentation, Other]
    validations: {required: true}
  - type: textarea
    id: experience
    attributes:
      label: What happened?
      description: Include what worked well, what was confusing, and what you expected. Remove personal data and private server details.
    validations: {required: true}
  - type: textarea
    id: suggestion
    attributes: {label: Suggested improvement}
