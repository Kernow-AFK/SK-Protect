name: Artwork feedback
description: Suggest a change to the README banner or project illustrations.
title: "Artwork: "
labels:
  - documentation
body:
  - type: dropdown
    id: asset
    attributes:
      label: Which asset is this about?
      options:
        - privacy-edition-banner.svg
        - network-boundaries.svg
        - telemetry-controls.svg
        - manual-updates.svg
        - multi-instance-install.svg
        - stay-on-page.svg
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Suggested change
      description: Describe what is unclear, inaccurate, inaccessible, or visually awkward.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Contribution notes
      options:
        - label: I created any proposed replacement asset or have permission to share it.
          required: true
        - label: I understand the repository may be private and inaccessible to people who are not collaborators.
          required: true
