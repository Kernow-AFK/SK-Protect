<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
<title id="t">SK Protect - inspected and blocked</title><desc id="d">A colorful oversized SKlauncher dashboard sends bright data labels along a transparent tube. A massive right-side shield with red cross and green sentinel stops every line before grey broker towers, a news kiosk, and empty bins.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#23203c"/><stop offset="1" stop-color="#51405a"/></linearGradient><linearGradient id="dashboard" x2="0" y2="1"><stop stop-color="#29324e"/><stop offset="1" stop-color="#151c33"/></linearGradient><linearGradient id="guard" x2="1" y2="1"><stop stop-color="#fcff60"/><stop offset=".5" stop-color="#5fffd2"/><stop offset="1" stop-color="#46cbff"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#090a17" flood-opacity=".6"/></filter><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#23203c"/><stop offset="1" stop-color="#51405a"/></linearGradient><linearGradient id="dashboard" x2="0" y2="1"><stop stop-color="#29324e"/><stop offset="1" stop-color="#151c33"/></linearGradient><linearGradient id="guard" x2="1" y2="1"><stop stop-color="#fcff60"/><stop offset=".5" stop-color="#5fffd2"/><stop offset="1" stop-color="#46cbff"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#090a17" flood-opacity=".6"/></filter><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
