<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Concept 3: Dead drop intercepted</title>
<desc id="desc">Bright data tokens fall toward a broker's collection mailbox. A playful privacy sentinel flips a switch and opens a secure trapdoor, sending the tokens into a local recycling vault instead.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101b35"/><stop offset="1" stop-color="#27244e"/></linearGradient>
 <linearGradient id="vault" x2="1" y2="1"><stop stop-color="#1de3c1"/><stop offset="1" stop-color="#5ebdff"/></linearGradient>
 <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#090b18" flood-opacity=".7"/></filter>
</defs>
<rect width="1440" height="760" rx="28" fill="url(#bg)"/><path d="M0 553 1440 490v270H0Z" fill="#151b35"/>
<text x="66" y="66" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#80f4dc">PRIVACY WATCH / LIVE INTERCEPT</text>
<!-- launcher / origin -->
<g filter="url(#shadow)"><rect x="74" y="175" width="273" height="191" rx="17" fill="#11182c" stroke="#52d9ff" stroke-width="3"/><path d="M74 215h273" stroke="#354462" stroke-width="2"/><circle cx="99" cy="195" r="6" fill="#ff6f91"/><circle cx="121" cy="195" r="6" fill="#ffce5b"/><circle cx="143" cy="195" r="6" fill="#6df2b8"/><path d="m164 239 36 13v31c0 33-15 51-36 66-21-15-36-33-36-66v-31Z" fill="#69efd0"/><path d="M151 279v-8a13 13 0 0 1 26 0v8" fill="none" stroke="#17304c" stroke-width="5"/><rect x="146" y="277" width="36" height="30" rx="6" fill="#17304c"/><text x="216" y="263" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#f2f0ff">SKlauncher</text><text x="216" y="290" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700" fill="#75ebdb">LOCAL FIRST</text><path d="M216 318h92m-92 17h69" stroke="#566583" stroke-width="6" stroke-linecap="round"/></g>
<!-- falling token stream -->
<path d="M405 230c85 26 68 104 173 120 89 13 73 79 169 104" fill="none" stroke="#ffb949" stroke-width="4" stroke-dasharray="3 13" stroke-linecap="round"/>
<g filter="url(#glow)"><circle cx="434" cy="250" r="12" fill="#ff5c97"/><path d="M500 299h22v22h-22z" fill="#63ddff"/><path d="m582 329 13-22 13 22Z" fill="#ce82ff"/><circle cx="675" cy="374" r="12" fill="#ffda62"/><path d="M738 423h22v22h-22z" fill="#a4ff54"/><circle cx="806" cy="456" r="10" fill="#ff6b83"/></g>
<!-- broker mail slot: empty -->
<g transform="translate(1113 173)" filter="url(#shadow)"><path d="M0 90 123 0l123 90v294H0Z" fill="#28243a" stroke="#79688b" stroke-width="3"/><path d="M23 101h200v257H23Z" fill="#343047"/><path d="M72 149h101v61H72Z" fill="#ffcc64"/><text x="122" y="174" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#3b2e48">DATA DROP</text><path d="M85 190h75" stroke="#694e67" stroke-width="4"/><rect x="77" y="255" width="91" height="46" rx="8" fill="#191a2d" stroke="#ff8da4" stroke-width="3"/><path d="M98 278h49" stroke="#74728a" stroke-width="3"/><text x="122" y="330" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#ffb96d">EMPTY</text></g>
<!-- interception switch / pivoting gate -->
<g filter="url(#shadow)"><path d="M798 485h257v26H798z" fill="#6d78a3"/><circle cx="879" cy="498" r="22" fill="#ff7d89" stroke="#ffe59b" stroke-width="4"/><path d="M879 498 972 408" stroke="#ff7d89" stroke-width="17" stroke-linecap="round"/><circle cx="972" cy="408" r="15" fill="#ffe17b" stroke="#fff4c5" stroke-width="3"/><rect x="824" y="523" width="108" height="16" rx="8" fill="#83f4d8"/><text x="878" y="568" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#9ff7e4">ROUTE DIVERTED</text></g>
<!-- locally secured recycling vault -->
<g filter="url(#shadow)"><path d="M521 500h242v142H521z" fill="#1c4160" stroke="url(#vault)" stroke-width="4"/><path d="M498 500h288l-37-42H536Z" fill="#344c71" stroke="#82f3df" stroke-width="3"/><path d="M552 537h181v78H552z" fill="#111b33" stroke="#4fdcc9" stroke-width="3"/><path d="m642 548 25 9v19c0 20-11 31-25 41-14-10-25-21-25-41v-19Z" fill="#69efd0"/><path d="m631 577 9 9 17-20" fill="none" stroke="#174660" stroke-width="5" stroke-linecap="round"/><text x="642" y="626" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700" fill="#95f8df">LOCAL VAULT</text></g>
<!-- mascot flipping switch -->
<g transform="translate(80 466)" filter="url(#shadow)"><rect x="0" y="42" width="104" height="100" rx="31" fill="#aeff51" stroke="#e9ffc0" stroke-width="4"/><rect x="18" y="0" width="68" height="68" rx="24" fill="#c8ff74" stroke="#e9ffc0" stroke-width="4"/><circle cx="39" cy="31" r="6" fill="#1a3651"/><circle cx="65" cy="31" r="6" fill="#1a3651"/><path d="M39 48q13 11 26 0" fill="none" stroke="#236a73" stroke-width="4" stroke-linecap="round"/><path d="M100 79h72" stroke="#c8ff74" stroke-width="13" stroke-linecap="round"/><circle cx="177" cy="79" r="10" fill="#ffcc64"/><path d="M25 141v21m55-21v21" stroke="#aeff51" stroke-width="13" stroke-linecap="round"/><text x="51" y="120" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="700" fill="#173651">SENTINEL</text></g>
<path d="M184 546c97-39 174-53 290-45" fill="none" stroke="#70f3d8" stroke-width="3" stroke-dasharray="4 12"/><path d="m452 492 23 9-21 12" fill="none" stroke="#70f3d8" stroke-width="4"/>
<text x="782" y="700" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#ecebff">INTERCEPTED. REDIRECTED. BROKER MAILBOX EMPTY.</text>
<rect x="1" y="1" width="1438" height="758" rx="27" fill="none" stroke="#7676bd" stroke-opacity=".5" stroke-width="2"/>
</svg>
