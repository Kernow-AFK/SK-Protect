<title id="t">SK Protect - no data reaches the empty street</title><desc id="d">An oversized SKlauncher dashboard in bright teal and coral sends streams of personal-data tokens toward a right-side shield with a red X. A smiling green sentinel guards its base. Beyond it, grey broker offices and a newspaper stand wait on a quiet empty street.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#292341"/><stop offset="1" stop-color="#56394e"/></linearGradient><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#283250"/><stop offset="1" stop-color="#131a31"/></linearGradient><linearGradient id="shield" x2="1" y2="1"><stop stop-color="#f4ff60"/><stop offset=".5" stop-color="#50f0ce"/><stop offset="1" stop-color="#56c7ff"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#080a17" flood-opacity=".65"/></filter><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
