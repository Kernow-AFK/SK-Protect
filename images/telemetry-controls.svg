<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Local privacy controls</title><desc id="desc">A settings panel shows analytics and rich presence disabled with settings retained on the local device.</desc>
<rect width="900" height="560" rx="18" fill="#e9f1f4"/><path d="M0 0h900v18H0z" fill="#327b89"/>
<text x="56" y="79" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#327b89" letter-spacing="2">PRIVACY MODEL / 02</text><text x="56" y="126" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#142d35">Make the default explicit</text>
<rect x="155" y="171" width="590" height="318" rx="12" fill="#fff" stroke="#c5d8dc" stroke-width="2"/>
<rect x="155" y="171" width="590" height="54" rx="12" fill="#173840"/><path d="M155 213h590v12H155z" fill="#173840"/><circle cx="183" cy="198" r="5" fill="#f0b75e"/><circle cx="202" cy="198" r="5" fill="#46d6b3"/><circle cx="221" cy="198" r="5" fill="#6aa8bb"/><text x="260" y="205" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#f3f7f4">Privacy controls</text>
<text x="198" y="273" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#192e33">Usage analytics</text><text x="198" y="298" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#678087">Opt out of launcher analytics events</text>
<rect x="635" y="256" width="66" height="34" rx="17" fill="#879995"/><circle cx="653" cy="273" r="12" fill="#fff"/><text x="198" y="358" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#192e33">Discord Rich Presence</text><text x="198" y="383" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#678087">Do not share the active instance with Discord</text>
<rect x="635" y="341" width="66" height="34" rx="17" fill="#879995"/><circle cx="653" cy="358" r="12" fill="#fff"/>
<path d="M198 415h504" stroke="#e0e8e8" stroke-width="2"/><rect x="198" y="438" width="18" height="18" rx="4" fill="#eaf7f2" stroke="#178c78" stroke-width="2"/><path d="m202 447 4 4 7-8" fill="none" stroke="#178c78" stroke-width="2"/><text x="230" y="453" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#54706a">Settings stay in the local profile</text>
<text x="56" y="524" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#54706a">Illustrative mockup; actual controls depend on the installed patch version.</text>
</svg>
