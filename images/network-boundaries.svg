<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Clear network boundaries</title><desc id="desc">A local launcher sits within a controlled boundary while required game services and optional services are visually separated.</desc>
<rect width="900" height="560" rx="18" fill="#f1f5f2"/><path d="M0 0h900v18H0z" fill="#178c78"/>
<text x="56" y="79" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#178c78" letter-spacing="2">PRIVACY MODEL / 01</text><text x="56" y="126" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#152a2b">Know which connections matter</text>
<rect x="56" y="176" width="788" height="310" rx="12" fill="#fff" stroke="#cbd8d1" stroke-width="2"/>
<rect x="86" y="221" width="270" height="218" rx="10" fill="#eaf7f2" stroke="#178c78" stroke-width="2"/><text x="111" y="258" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#178c78" letter-spacing="1">LOCAL DEVICE</text>
<rect x="117" y="293" width="208" height="100" rx="9" fill="#172f35"/><rect x="133" y="308" width="176" height="11" rx="5" fill="#46d6b3"/><rect x="133" y="333" width="110" height="7" rx="3" fill="#78918a"/><rect x="133" y="351" width="147" height="7" rx="3" fill="#78918a"/><circle cx="150" cy="378" r="5" fill="#f0b75e"/><circle cx="170" cy="378" r="5" fill="#46d6b3"/><text x="148" y="421" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#34534d">Patched launcher</text>
<path d="M356 330h112" stroke="#178c78" stroke-width="3" stroke-dasharray="7 8"/><path d="m456 318 14 12-14 12" fill="none" stroke="#178c78" stroke-width="3"/>
<rect x="485" y="221" width="326" height="91" rx="9" fill="#eaf7f2" stroke="#178c78"/><circle cx="520" cy="266" r="14" fill="#178c78"/><path d="m513 266 5 5 10-11" fill="none" stroke="#fff" stroke-width="3"/><text x="550" y="258" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#152a2b">Microsoft / Mojang</text><text x="550" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#54706a">Authentication and game delivery</text>
<rect x="485" y="337" width="326" height="91" rx="9" fill="#fff5e6" stroke="#d7a54f"/><circle cx="520" cy="382" r="14" fill="#f0b75e"/><path d="M514 376l12 12m0-12-12 12" stroke="#473411" stroke-width="2.5"/><text x="550" y="374" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#152a2b">Optional background services</text><text x="550" y="399" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#725b31">Reduced by the local patch</text>
<text x="56" y="524" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#54706a">Patches are not a firewall; required game services remain reachable.</text>
</svg>
