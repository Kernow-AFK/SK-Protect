<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Concept 4: A street with nothing to sell</title>
<desc id="desc">A protected launcher sends colorful data toward an empty commercial district. A bright barrier catches every token. A waiting fictional broker stands beside a silent newspaper kiosk and empty inbox.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#111b33"/><stop offset="1" stop-color="#2d2754"/></linearGradient>
 <linearGradient id="city" x2="0" y2="1"><stop stop-color="#3d426a"/><stop offset="1" stop-color="#252b49"/></linearGradient>
 <linearGradient id="barrier" x2="0" y2="1"><stop stop-color="#c4ff52"/><stop offset=".5" stop-color="#4ce6cb"/><stop offset="1" stop-color="#4bbdff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#080b1b" flood-opacity=".6"/></filter>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="stars" width="64" height="64" patternUnits="userSpaceOnUse"><circle cx="8" cy="12" r="1.3" fill="#fff" opacity=".23"/><circle cx="40" cy="45" r="1" fill="#fff" opacity=".15"/></pattern>
</defs>
<rect width="1440" height="760" rx="28" fill="url(#sky)"/><rect width="1440" height="500" rx="28" fill="url(#stars)"/>
<text x="66" y="66" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#8df6df">PROTECTED SIDE</text><text x="1060" y="66" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#ffc36d">BROKER DISTRICT</text>
<!-- local launcher -->
<g filter="url(#shadow)"><rect x="62" y="180" width="244" height="191" rx="16" fill="#11182b" stroke="#4fd8ff" stroke-width="3"/><path d="M62 218h244" stroke="#394765" stroke-width="2"/><circle cx="86" cy="199" r="6" fill="#ff6f91"/><circle cx="108" cy="199" r="6" fill="#ffd05b"/><circle cx="130" cy="199" r="6" fill="#70efb9"/><path d="m144 240 34 13v29c0 32-14 49-34 64-20-15-34-32-34-64v-29Z" fill="#68efd0"/><path d="M132 278v-8a12 12 0 0 1 24 0v8" fill="none" stroke="#18304b" stroke-width="5"/><rect x="127" y="276" width="34" height="29" rx="5" fill="#18304b"/><text x="190" y="260" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#f1efff">SKlauncher</text><text x="190" y="284" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700" fill="#7fead7">LOCAL</text><path d="M190 311h83m-83 17h60" stroke="#526280" stroke-width="6" stroke-linecap="round"/></g>
<!-- bright data rays to barrier -->
<path d="M311 270h391m-391 39h391m-391 39h391" stroke="#ffbf52" stroke-width="3" stroke-dasharray="2 13"/><g filter="url(#glow)"><circle cx="357" cy="270" r="7" fill="#ff61a8"/><path d="M421 300h13v13h-13z" fill="#72f6e0"/><path d="m501 348 9-16 9 16Z" fill="#80c7ff"/><circle cx="593" cy="270" r="7" fill="#c5ff59"/><path d="M649 301h13v13h-13z" fill="#ffbe58"/></g>
<!-- vivid barrier -->
<g filter="url(#shadow)"><path d="M745 116 851 156v131c0 120-49 195-106 238-57-43-106-118-106-238V156Z" fill="url(#barrier)" stroke="#f4fff1" stroke-width="5"/><path d="M745 151 827 181v106c0 91-35 151-82 188-47-37-82-97-82-188V181Z" fill="#172447" stroke="#d8fff0" stroke-width="2"/><path d="m705 287 28 29 55-63" fill="none" stroke="#bfff63" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="745" y="558" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#baff77">SEALED BOUNDARY</text>
<!-- empty street and city -->
<path d="M0 502 1440 475v285H0Z" fill="#171b32"/><path d="M836 0h604v492l-604 11Z" fill="#252940" opacity=".7"/>
<g fill="url(#city)" stroke="#69739a" stroke-opacity=".45" stroke-width="2"><path d="M898 181h105v299H898z"/><path d="M1022 124h135v356h-135z"/><path d="M1174 201h100v279h-100z"/><path d="M1290 154h105v326h-105z"/></g>
<g fill="#9fa5cf" opacity=".24"><path d="M918 207h13v19h-13zm29 0h13v19h-13zm29 0h13v19h-13zm-58 41h13v19h-13zm29 0h13v19h-13zm29 0h13v19h-13zM1044 158h15v21h-15zm34 0h15v21h-15zm34 0h15v21h-15zm-68 43h15v21h-15zm34 0h15v21h-15zm34 0h15v21h-15zm-68 43h15v21h-15zm34 0h15v21h-15zm34 0h15v21h-15zM1192 228h13v18h-13zm29 0h13v18h-13zm29 0h13v18h-13zm-58 39h13v18h-13zm29 0h13v18h-13zm29 0h13v18h-13zM1310 183h13v19h-13zm28 0h13v19h-13zm28 0h13v19h-13zM1310 222h13v19h-13zm28 0h13v19h-13zm28 0h13v19h-13z"/></g>
<!-- waiting fictional broker silhouette, smaller and frustrated -->
<g transform="translate(1028 326)" filter="url(#shadow)"><path d="M17 90 51 65h74l35 25 27 134H-6Z" fill="#181624" stroke="#51435f" stroke-width="2"/><path d="M68 65v38l23 37 21-37V65Z" fill="#37253f"/><path d="M65 67V35h54v35" fill="#d89b73"/><path d="M48 37c0-38 16-57 45-57s48 22 47 57l-17 40-31 18-32-19Z" fill="#e6aa83"/><path d="M46 37C41 0 60-24 94-23c34 1 51 24 47 57l-20-19-19-8-39 13Z" fill="#211a2c"/><path d="m74 29 20-6m31 5 17 5" stroke="#3e2737" stroke-width="5" stroke-linecap="round"/><path d="m105 31 10 17-9 8 16 3" fill="none" stroke="#b76f62" stroke-width="6" stroke-linecap="round"/><path d="M76 66q31 22 61-1" fill="none" stroke="#793d58" stroke-width="6" stroke-linecap="round"/><path d="M26 103 3 82m153 21 22-21" stroke="#e6aa83" stroke-width="12" stroke-linecap="round"/><text x="89" y="171" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700" fill="#ffcb6c">STILL WAITING</text></g>
<!-- empty newspaper kiosk and mailbox -->
<g transform="translate(1218 445)" filter="url(#shadow)"><path d="M0 18 81 0l81 18v87H0Z" fill="#394361" stroke="#93a1c4" stroke-width="2"/><path d="M-9 18h181v16H-9Z" fill="#ffbe55"/><rect x="17" y="45" width="127" height="44" rx="3" fill="#f1f1e8"/><text x="80" y="63" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700" fill="#424760">DAILY NEWS</text><path d="M33 72h94" stroke="#aab0bc" stroke-width="3"/><text x="81" y="125" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#c2c6dc">NO PLAYER DATA</text></g>
<g transform="translate(1000 566)"><rect x="0" y="0" width="131" height="78" rx="8" fill="#32364f" stroke="#7580a6" stroke-width="2"/><rect x="25" y="20" width="82" height="22" rx="4" fill="#15192d" stroke="#ff758e" stroke-width="2"/><path d="M45 31h41" stroke="#9ba4bf" stroke-width="2"/><text x="65" y="67" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700" fill="#ffcb6c">EMPTY INBOX</text></g>
<!-- road -->
<path d="M0 621 1440 592v168H0Z" fill="#11172c"/><path d="M500 650h34m-57 43h38m-61 42h44" stroke="#d9ce8c" stroke-width="4" stroke-linecap="round" opacity=".7"/><path d="M0 622 1440 592" stroke="#54617d" stroke-width="2"/>
<text x="720" y="711" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" letter-spacing="1" fill="#e4e7ff">BRIGHT DATA IN. NOTHING CROSSES. THE STREET STAYS QUIET.</text>
<rect x="1" y="1" width="1438" height="758" rx="27" fill="none" stroke="#7776b7" stroke-opacity=".5" stroke-width="2"/>
</svg>
