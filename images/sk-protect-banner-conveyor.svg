<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
<title id="t">SK Protect - secure conveyor disposal</title><desc id="d">A large SKlauncher library dashboard sends colorful boxes of personal data along a conveyor. At a shield-marked cutoff, the boxes fall into a secure destroyer. A cheerful green sentinel mascot watches over the disposal; grey broker offices wait beyond with empty windows.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#28233f"/><stop offset="1" stop-color="#4b3049"/></linearGradient><linearGradient id="dash" x2="0" y2="1"><stop stop-color="#27304c"/><stop offset="1" stop-color="#12192e"/></linearGradient><linearGradient id="belt" x2="0" y2="1"><stop stop-color="#606b82"/><stop offset="1" stop-color="#30354b"/></linearGradient><linearGradient id="crusher" x2="1" y2="1"><stop stop-color="#ff4f85"/><stop offset="1" stop-color="#ffb43f"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#080915" flood-opacity=".65"/></filter><filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
