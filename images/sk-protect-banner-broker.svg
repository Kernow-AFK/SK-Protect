<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
<title id="t">SK Protect - the broker gets nothing</title><desc id="d">A large SKlauncher dashboard emits colorful personal-data tokens that are stopped by a bright shield with a red cross. A sly fictional broker waits outside among empty grey offices.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#25233e"/><stop offset="1" stop-color="#47314d"/></linearGradient>
 <linearGradient id="dash" x2="0" y2="1"><stop stop-color="#252c49"/><stop offset="1" stop-color="#111b31"/></linearGradient>
 <linearGradient id="shield" x2="1" y2="1"><stop stop-color="#f5ff67"/><stop offset=".48" stop-color="#5affcd"/><stop offset="1" stop-color="#48c8ff"/></linearGradient>
 <linearGradient id="city" x2="0" y2="1"><stop stop-color="#70748b"/><stop offset="1" stop-color="#434858"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#080b17" flood-opacity=".65"/></filter>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="stars" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="5" cy="7" r="1.3" fill="#fff" opacity=".13"/></pattern>
</defs>
<rect width="1600" height="800" rx="28" fill="url(#bg)"/><rect width="1600" height="800" rx="28" fill="url(#stars)"/>
<path d="M0 630 1600 560v240H0Z" fill="#191c32"/>
